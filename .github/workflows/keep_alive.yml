name: Keep Streamlit App Alive

on:
  schedule:
    # Trigger automatically every day at midnight (UTC)
    - cron: '0 0 * * *'
  workflow_dispatch: # Allows manual trigger from GitHub Actions UI

jobs:
  ping-app:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Streamlit App
        run: |
          curl -sS https://erpframework.streamlit.app/ > /dev/null
          echo "Successfully pinged Streamlit App to keep it awake!"
