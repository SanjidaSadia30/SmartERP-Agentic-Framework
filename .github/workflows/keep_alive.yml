name: Keep Streamlit App Alive

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch: 

jobs:
  ping-app:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Streamlit App
        run: |
          curl -sS https://erpframe.streamlit.app/ > /dev/null
          echo "Successfully pinged Streamlit App to keep it awake!"
